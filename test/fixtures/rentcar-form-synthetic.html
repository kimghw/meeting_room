<!DOCTYPE html>

  <script type="text/javascript">
    // 이 alert 들은 **정적으로 박혀 있다.** 제출에 성공해도 응답에 그대로 들어 있으므로
    // readAlert 가 "새로 생긴 문구"만 골라내지 못하면 성공을 오류로 보고하게 된다.
    function fnSave() {
        if (document.getElementById("DDL_CARNAME").value == "0") {
            alert('렌트할 차량을 선택 하세요.');
            return false;
        }
        if (document.getElementById("TXT_DRIVER").value == "") {
            alert('운전자를 선택 하세요.');
            return false;
        }
        if (document.getElementById("TXT_TITLE").value == "") {
            alert('사용목적을 입력 하세요.');
            return false;
        }
        if (document.getElementById("TXT_PLACE").value == "") {
            alert('행선지를 입력 하세요.');
            return false;
        }
        return true;
    }
    function __doPostBack(eventTarget, eventArgument) {
        var theForm = document.forms['form1'];
        theForm.__EVENTTARGET.value = eventTarget;
        theForm.__EVENTARGUMENT.value = eventArgument;
        theForm.submit();
    }
  </script>
